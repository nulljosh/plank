<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Plank Book</title>
<meta name="description" content="Learn Plank from the first line to the last stage of the compiler. Every program in the book is compiled and checked by the test suite.">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="book.css">
</head>
<body>
<!-- generated by tools/gen-book.py from book/*.md; edit those, not this -->
<header class="bar">
  <a class="brand" href="../"><img src="../icon.svg" alt="" width="24" height="24"><span>Plank</span></a>
  <span class="crumb">The Book <small>v{{version}}</small></span>
  <a class="src" href="https://github.com/nulljosh/plank/tree/main/book">Edit on GitHub</a>
</header>
<div class="layout">
  <nav class="toc" aria-label="Chapters"><p class="label">Chapters</p><ol>
{{toc}}
  </ol></nav>
  <main class="book">
    <div class="cover">
      <p class="label">The Plank Book</p>
      <p class="cover-h">Write a language. Then read its compiler.</p>
      <p class="cover-sub">Thirteen short chapters. Every program in them is compiled and run by the test suite, so what you read here is what Plank does.</p>
    </div>
{{chapters}}
  </main>
</div>
</body>
</html>
