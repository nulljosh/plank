<svg viewBox="0 0 680 200" role="img" aria-label="The collector marks every block reachable from the stack and registers, then frees the rest" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12">
  <defs><marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="currentColor" class="fig-sub">
    <text x="4" y="14">ROOTS</text><text x="200" y="14">HEAP</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="4" y="24" width="130" height="150" rx="3"/><path d="M4 74H134M4 124H134"/>
    <path d="M110 49H218M110 99H218M330 49H408" marker-end="url(#a12)"/>
    <rect x="420" y="110" width="110" height="40" rx="3" stroke-dasharray="5 4"/>
    <rect x="560" y="60" width="110" height="40" rx="3" stroke-dasharray="5 4"/>
    <path d="M530 130C560 130 560 100 576 100" stroke-dasharray="3 3" marker-end="url(#a12)"/>
  </g>
  <g class="fig-ink"><rect x="220" y="29" width="110" height="40" rx="3"/><rect x="220" y="79" width="110" height="40" rx="3"/><rect x="410" y="29" width="110" height="40" rx="3"/></g>
  <g fill="currentColor">
    <text x="16" y="53">stack word</text><circle cx="110" cy="49" r="4"/>
    <text x="16" y="103">register</text><circle cx="110" cy="99" r="4"/>
    <text x="16" y="153" class="fig-sub">a plain int</text>
    <g class="fig-on-ink" font-weight="700"><text x="232" y="53">list</text><text x="232" y="103">struct</text><text x="422" y="53">string</text></g>
    <text x="432" y="135" class="fig-sub">old list</text><text x="572" y="85" class="fig-sub">its struct</text>
  </g>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="currentColor" class="fig-sub">
    <text x="220" y="170">Filled: reached from a root, kept. Dashed: nothing reaches</text>
    <text x="220" y="188">them, not even each other's pointer, so they are freed.</text>
  </g>
</svg>
